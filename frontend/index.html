<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget lets Android shrink the layout viewport when the
         keyboard opens, so the editor toolbar is not hidden behind it. iOS
         ignores it and is handled from visualViewport in JS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Phone browser chrome. Must track --color-ground or the notch area
         sits in a different colour from the page under it. -->
    <meta name="theme-color" content="#141414" />
    <title>Party Codex</title>
    <meta
      name="description"
      content="A player-facing D&amp;D companion — only what the party has learned."
    />

    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <!-- iOS ignores the manifest's icons and reads this one. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Home-screen launch on iOS. black-translucent puts the page under the
         status bar, which is what viewport-fit=cover above already assumes —
         the safe-area padding in styles.css keeps content clear of it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Codex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
